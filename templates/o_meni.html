{% extends "base.html" %}

{% block title %}{{ t.o_meni.title }}{% endblock %}

{% block content %}
  <main class="container o-meni-container">
    <h2>{{ t.o_meni.heading }}</h2>
    {% for paragraph in t.o_meni.paragraphs %}
      <p>{{ paragraph }}</p>
    {% endfor %}
  </main>

  <section class="o-meni-images o-meni-images--tight">
    <a href="{{ url_for('static', filename='images/certifikat1.jpg') }}" target="_blank" class="extension-image">
      <img src="{{ url_for('static', filename='images/certifikat1.jpg') }}" alt="{{ t.o_meni.cert_alt_1 }}">
    </a>
    <a href="{{ url_for('static', filename='images/certifikat2.jpg') }}" target="_blank" class="extension-image">
      <img src="{{ url_for('static', filename='images/certifikat2.jpg') }}" alt="{{ t.o_meni.cert_alt_2 }}">
    </a>
  </section>
{% endblock %}
